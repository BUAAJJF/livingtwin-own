[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-push"
version = "0.1.0"
description = "End-to-end joint-space PPO: AgileX PiPER-X pushes a cube to random goals (mjlab)"
requires-python = ">=3.10,<3.14"
dependencies = ["mjlab==1.6.0"]

# mjlab imports this at startup to discover tasks.
[project.entry-points."mjlab.tasks"]
piper_push = "piper_push.tasks"

[tool.setuptools.packages.find]
where = ["src"]
